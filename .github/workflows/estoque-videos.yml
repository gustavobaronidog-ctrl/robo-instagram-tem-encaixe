name: Alerta de estoque de videos

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  estoque:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir estoque
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 estoque_videos.py
