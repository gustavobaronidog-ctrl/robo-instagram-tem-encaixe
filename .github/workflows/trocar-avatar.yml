name: Trocar avatar (uso unico)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trocar-avatar
  cancel-in-progress: false
jobs:
  trocar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas de imagem
        run: pip install pillow numpy scipy
      - name: Trocar o mascote nas imagens que ainda vao sair
        run: python3 trocar_avatar.py
      - name: Guardar
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add -A imagens avatar_feito.txt
          git commit -m "troca o mascote por versao em alta qualidade" || echo "nada a guardar"
          git pull --rebase
          git push
