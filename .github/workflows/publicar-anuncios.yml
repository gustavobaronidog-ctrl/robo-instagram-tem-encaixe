name: Publicar Anuncio no Instagram

on:
  # Horarios agora no maestro.yml (cron antigo desligado para nao duplicar)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar o proximo anuncio
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: python3 publicar_anuncio.py

      - name: Guardar o avanco da fila
        if: always()
        run: |
          git config user.name "robo-tem-encaixe"
          git config user.email "robo@temencaixe.com"
          git add estado_anuncios.json token.enc 2>/dev/null || git add estado_anuncios.json
          git diff --staged --quiet || git commit -m "avanca a fila de anuncios"
          git pull --rebase -q || true
          git push
