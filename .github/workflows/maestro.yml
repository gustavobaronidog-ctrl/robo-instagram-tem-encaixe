name: Maestro dos posts

on:
  schedule:
    # Reserva: se a corrente de plantoes se quebrar, o agendamento religa. 24 horas por dia.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Plantao de ~50 min (confere a cada 5 min e publica o atrasado)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          git config user.name "robo-tem-encaixe"
          git config user.email "robo@temencaixe.com"
          python3 maestro.py

      - name: Guardar o avanco das filas (garantia extra)
        if: always()
        run: |
          git config user.name "robo-tem-encaixe"
          git config user.email "robo@temencaixe.com"
          git add estado.json estado_reels.json estado_anuncios.json token.enc 2>/dev/null || git add estado.json estado_reels.json estado_anuncios.json
          git diff --staged --quiet || git commit -m "maestro: avanca as filas"
          git pull --rebase -q || true
          git push || true

      - name: Ligar a proxima rodada (24h por dia, com 3 tentativas)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run maestro.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            echo "Tentativa $i de ligar a proxima rodada falhou; tentando de novo em 20s."
            sleep 20
          done
          echo "NAO CONSEGUI LIGAR A PROXIMA RODADA: o agendamento de reserva (a cada 30 min) religa o plantao."
          exit 1
