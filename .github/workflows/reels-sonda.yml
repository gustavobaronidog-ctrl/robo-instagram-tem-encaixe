name: Sonda dos Reels (uso unico)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reels-sonda
  cancel-in-progress: false
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tirar quadros
        run: |
          mkdir -p sonda_quadros
          for n in 122 150 200 250 300; do
            f=reels/c$n.mp4
            if [ -f $f ]; then
              ffmpeg -y -v error -ss 0.6 -i $f -frames:v 1 sonda_quadros/c${n}_a.jpg
              ffmpeg -y -v error -ss 3 -i $f -frames:v 1 sonda_quadros/c${n}_b.jpg
              ffprobe -v error -show_entries format=duration -show_entries stream=width,height -of default=nw=1 $f > sonda_quadros/c$n.txt
            fi
          done
      - name: Guardar
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add sonda_quadros
          git commit -m "quadros dos reels" || echo nada
          git pull --rebase
          git push
