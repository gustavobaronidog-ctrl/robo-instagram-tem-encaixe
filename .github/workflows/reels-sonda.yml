name: Sonda dos Reels (uso unico)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reels-sonda
  cancel-in-progress: false
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Medir um Reel atual
        run: |
          ffmpeg -version > ffv.txt; head -n 1 ffv.txt > sonda.txt
          for f in reels/c83.mp4 reels/c84.mp4; do
            echo "== $f" >> sonda.txt
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,duration,bit_rate,pix_fmt -show_entries format=duration,bit_rate -of default=nw=1 $f >> sonda.txt
            ffmpeg -hide_banner -i $f -vf "select='gt(scene,0.08)',showinfo" -an -f null - 2>&1 | grep -o "pts_time:[0-9.]*" >> sonda.txt || true
          done
          ls reels > lista.txt; head -n 5 lista.txt >> sonda.txt
          wc -l < lista.txt >> sonda.txt
          mkdir -p sonda_quadros
          ffmpeg -y -v error -ss 0.5 -i reels/c83.mp4 -frames:v 1 sonda_quadros/c83_q1.jpg
          ffmpeg -y -v error -ss 3 -i reels/c83.mp4 -frames:v 1 sonda_quadros/c83_q2.jpg
      - name: Guardar
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add sonda.txt sonda_quadros
          git commit -m "sonda dos reels" || echo nada
          git pull --rebase
          git push
